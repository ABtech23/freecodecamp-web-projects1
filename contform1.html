<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Contact Form</title>
    <link rel="stylesheet" href="stylescontform1.css">
</head>

<body>
    <div class="form-container">
        <h1>Contact Form</h1>
        <form>
            <h2>Your Information</h2>
            <label for="name">Enter Your Name: <input type="text" name="name" id="name" required>
            </label>
            <label for="email">Enter Your Email: <input type="email" id="email" name="email" required></label>
            <label for="message">Enter Your Message: <textarea id="message" name="message" rows="4" cols="30"
                    required></textarea>
            </label>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>

</html>
