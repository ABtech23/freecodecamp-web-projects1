<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link rel="stylesheet" href="stylesplayingcard1.css">
</head>

<body>
  <h1>Playing Cards</h1>
  <main id="playing-cards">
    <div class="card">
      <div class="left">♠</div>
      <div class="middle">
        <span>♠</span>
      </div>
      <div class="right">♠</div>
    </div>
    <div class="card">
      <div class="left">♣</div>
      <div class="middle">
        <span>♣</span>
        <span>♣</span>
      </div>
      <div class="right">♣</div>
    </div>
    <div class="card">
      <div class="left">♥</div>
      <div class="middle">
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
      </div>
      <div class="right">♥</div>
    </div>
    <div class="card">
      <div class="left">♦</div>
      <div class="middle">
        <span>♦</span>
        <span>♦</span>
        <span>♦</span>
        <span>♦</span>
      </div>
      <div class="right">♦</div>
    </div>
  </main>
</body>

</html>
