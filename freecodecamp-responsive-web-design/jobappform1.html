<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="stylesjobappform1.css">
</head>

<body>
    <div class="container">
        <h1>Job Application Form</h1>

        <form>
            <label for="name">Enter Your Name:</label>
            <input type="text" id="name" name="name" placeholder="E.g., John Dave" required>

            <label for="email">Enter Your Email:</label>
            <input type="email" id="email" name="email" placeholder="example@gmail.com" required>

            <label for="position">Enter Your Position:</label>
            <select id="position" name="position" required>
                <option value="" selected>Select a position</option>
                <option value="developer">Developer</option>
                <option value="designer">Designer</option>
                <option value="manager">Manager</option>
                <option value="sales">Sales</option>
            </select>

            <fieldset class="radio-group">
                <legend>Availability</legend>

                <input type="radio" id="radio-ft" name="availability" value="full-time" required>
                <label for="radio-ft" class="radio-method">Full-Time</label>

                <input type="radio" id="radio-pt" name="availability" value="part-time">
                <label for="radio-pt" class="radio-method">Part-Time</label>
            </fieldset>

            <label for="message">Why do you want this job?</label>
            <textarea id="message" name="message" rows="4" cols="25"
                placeholder="Tell us a little about yourself..."></textarea>

            <button type="submit" class="submit">Submit</button>
        </form>
    </div>
</body>

</html>
