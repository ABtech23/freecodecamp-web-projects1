<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Pricing Plans Layout Page</title>
  <link rel="stylesheet" href="stylespricingplan1.css">
</head>

<body>
  <h1>Pricing Plans</h1>
  <div class="pricing-container">
    <div class="pricing-card basic-plan">
      <h2>Basic</h2>
      <p>$9/month</p>
      <ul>
        <li>5 Projects</li>
        <li>Basic Support</li>
        <li>10 GB Storage</li>
      </ul>
    </div>
    <div class="pricing-card pro-plan">
      <h2>Pro</h2>
      <p>$19/month</p>
      <ul>
        <li>20 Projects</li>
        <li>Priority Support</li>
        <li>50 GB Storage</li>
      </ul>
    </div>
    <div class="pricing-card premium-plan">
      <h2>Premium</h2>
      <p>$29/month</p>
      <ul>
        <li>Unlimited Projects</li>
        <li>24/7 Support</li>
        <li>100 GB Storage</li>
      </ul>
    </div>
  </div>
</body>

</html>
