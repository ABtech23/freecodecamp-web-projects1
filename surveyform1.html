<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
    </style>
</head>

<body>
    <h1 id="title">A Survey Form</h1>
    <p id="description">Thank you for your time to fill this form</p>
    <form id="survey-form">
        <label for="name" id="name-label">Name: </label>
        <input id="name" name="name" type="text" placeholder="name" value="name" required><br>
        <label for="email" id="email-label">Email: </label>
        <input id="email" name="email" type="email" placeholder="example@gmail.com" value="email" required><br>
        <label for="number" id="number-label">Age: </label>
        <input id="number" name="age" type="number" min="12" max="100" placeholder="age" value="age" required>
        <br><br>

        <label for="friend">Would you recommend this to your friends</label><br>
        <input type="radio" id="definitely" name="recommend" value="friend">
        <label for="definitely">Definitely</label>
        <input type="radio" id="maybe" name="recommend" value="maybe">
        <label for="maybe">Maybe</label>
        <input type="radio" id="notsure" name="recommend" value="maybe">
        <label for="notsure">Not Sure</label>
        <br></br>

        <label for="feature">What's your favourite features of this?</label><br>
        <select name="feature" id="dropdown">
            <option value="challenges">Challenges</option>
            <option value="projects">Projects</option>
            <option value="opensource" selected>Open Source</option>
            <option value="community">Community</option>
        </select>
        <br><br>

        <div class="checkbox-group">
            <div>
                <input type="checkbox" id="front-end" name="front-end" value="front-end">
                <label for="front-end">Front-end Projects</label>
            </div>

            <div>
                <input type="checkbox" id="back-end" name="back-end" value="back-end">
                <label for="back-end">Back-end Projects</label>
            </div>

            <div>
                <input type="checkbox" id="data-visual" name="data-visual" value="data-visual">
                <label for="data-visual">Data Visualization</label>
            </div>

            <div>
                <input type="checkbox" id="challenges" name="challenges" value="challenges">
                <label for="challenges">Challenges</label>
            </div>

            <div>
                <input type="checkbox" id="open-source" name="open-source" value="open-source">
                <label for="open-source">Open Source Community</label>
            </div>

            <div>
                <input type="checkbox" id="gitter" name="gitter" value="gitter">
                <label for="gitter">Gitter help rooms</label>
            </div>
        </div>

        <input type="checkbox" id="gitter" name="gitter" value="#survey-form">
        <label for="gitter">Gitter help rooms</label>
        <br><br>

        <label for="comments">Any comments or suggestion?</label><br>
        <textarea id="comments" rows="4" cols="30" placeholder="your comments"></textarea>
        <br><br>

        <button type="submit" id="submit">Submit</button>
    </form>
</body>
 
</html>
