<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia Player</title>
  <style>
    body {
      background-color: lightblue;
    }
  </style>
</head>

<body>
  <h1>Multimedia Player</h1>
  <section>
    <h2>Audio</h2>
    <audio controls aria-label="descriptive label">
      <source src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3" type="audio/mpeg">
    </audio>
  </section>
  <section>
    <h2>Video</h2>
    <video controls aria-label="descriptive label" width="500">
      <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4"
        type="video/mp4">
      <track src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt"
        kind="this" srclang="en" label="english">
    </video>
  </section>
  <section>
    <h2>Transcript</h2>
    <p>there we go</p>
  </section>
</body>

</html>
