<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Settings Panel</title>
  <link rel="stylesheet" href="stylesgapaset1.css" />
</head>

<body>
  <div class="settings-card">
    <h1>Game Settings</h1>
    <label for="sound-effects">
      <input type="checkbox" id="sound-effects"> Sound Effects
    </label>
    <label for="background-music">
      <input type="checkbox" id="background-music"> Background Music
    </label>
    <label for="hard-mode">
      <input type="checkbox" id="hard-mode"> Hard Mode
    </label>
    <label for="haptic-feedback">
      <input type="checkbox" id="haptic-feedback"> Haptic Feedback
    </label>
  </div>
</body>

</html>
