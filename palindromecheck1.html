<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="stylespalindrommecheck1.css">
</head>

<body>
    <h1>Palindrome Checker</h1>

    <div class="cardthis">
        <label for="text-input">Enter a text</label>
        <input id="text-input" type="text">
        <button id="check-btn">Check</button>
        <p id="result"></p>
    </div>

    <p class="paragraph">
        A palindrome is a word or sentence that's spelled the same way
        both forward and backward, ignoring punctuation, case, and spacing.
    </p>

    <script src="scriptpalindromecheck1.js"></script>
</body>

</html>
