<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To_Do_list1</title>
    <link href="stylestodo1.css" rel="stylesheet" />
</head>

<body>
    <ul class="todo-list">
        <h1>To Do List:</h1>

        <li>
            <input type="checkbox" id="typing" value="typing">
            <label for="typing">typing</label>

            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="https://www.google.com" target="_blank">
                        link of a typing website
                    </a>
                </li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="programming" value="programming">
            <label for="programming">programming</label>

            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="https://www.google.com" target="_blank">
                        link of a programming website
                    </a>
                </li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="exploring" value="exploring">
            <label for="exploring">exploring</label>

            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="https://www.google.com" target="_blank">
                        link of an insight website
                    </a>
                </li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="animals" value="animals">
            <label for="animals">animals</label>

            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="https://www.google.com" target="_blank">
                        link of an animal website
                    </a>
                </li>
            </ul>
        </li>

    </ul>


    <script>
        document.addEventListener('DOMContentLoaded', function () {

            const checkboxes = document.querySelectorAll('.human');
            checkboxes.forEach(function (checkbox) {
                checkbox.addEventListener('click', function () {

                    this.style.color = 'rgb(0, 153, 255)';
                });
            });


            document.addEventListener('click', function (event) {
                if (event.target.id === 'human4') {
                    this.style.color = 'rgb(10, 112, 112)';
                }
            });

        });

    </script>
</body>

</html>
